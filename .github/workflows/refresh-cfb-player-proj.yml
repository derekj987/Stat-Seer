name: Refresh CFB player projections

# Rebuilds web/lib/ncaafPlayerProjections.ts (the /ncaaf/model/players data), then commits it —
# Vercel auto-deploys. The board is driven by the UPCOMING slate x depth charts (every game gets
# our line-blind projections), with a book line attached where cfb_prop_snapshots has one.
# Twice daily in-season so new games/props flow in and hit-rates track the posted line as it
# moves: books post most college props Friday night and Saturday morning, and a single 13:00 UTC
# run left the file a day behind the market on game day (the view fills any player priced since
# with a live row, but his projection waits for this job). Each run follows a props capture
# (capture-cfb-props, every 2 hours) so it sees fresh lines. All times UTC.

on:
  schedule:
    - cron: "0 1,13 * 8-12,1 *"   # 01:00 + 13:00 UTC, Aug-Jan (season + bowls)
  workflow_dispatch: {}         # manual "Run workflow"

concurrency:
  group: refresh-cfb-player-proj
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Raised from 25. Fixing the 1000-row truncation in cfb_player_proj.sb_get took the slate from
    # 7 games to 35, so team_logs now walks 86 teams instead of 14. The per-team-season log cache
    # below makes a warm run fast again, but the FIRST run after a cache miss still pays the full
    # ~172 CFBD calls, and a cold run must not fail.
    timeout-minutes: 50
    permissions:
      contents: write   # commit the regenerated projection + depth-chart files
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the rebase-before-push works cleanly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet certifi -c requirements.txt

      # Completed-season game logs (2024/2025) are immutable, but data/ is gitignored so a fresh
      # runner re-downloads all of them every day. Cache them across runs; the key is pinned to the
      # season list so bumping HIST_SEASONS naturally invalidates it.
      - name: Cache CFBD completed-season game logs
        uses: actions/cache@v4
        with:
          path: data/cfb_logs
          key: cfb-logs-2024-2025-v1

      # The projector reads data/cfb.db for the UPCOMING slate (which games to project) — that
      # file is gitignored and absent on a fresh runner, so rebuild the current-season schedule
      # + scores from CFBD first. Without it upcoming_games() is empty and nothing regenerates.
      - name: Rebuild cfb.db — current-season schedule + scores
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python cfb_backfill.py --start 2026 --end 2026

      # Current depth charts drive role-adjusted volume (a promoted RB is projected on a
      # starter's carries). Scrape first so the projector reads a fresh cfb_depth.json.
      - name: Scrape NCAAF depth charts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python cfb_depth.py

      - name: Build NCAAF player projections
        env:
          CFBD_API_KEY:         ${{ secrets.CFBD_API_KEY }}         # /games/players logs
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}          # read cfb_prop_snapshots
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cfb_player_proj.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- web/lib/ncaafPlayerProjections.ts web/lib/ncaafDepth.ts cfb_depth.json; then
            echo "No projection/depth change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/lib/ncaafPlayerProjections.ts web/lib/ncaafDepth.ts cfb_depth.json
          git commit -m "chore: refresh CFB depth charts + player projections (auto)"
          # Several bots push this branch; retry rebase+push a few times before failing.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i lost the race; retrying..."; sleep $((RANDOM % 5 + 2))
          done
          echo "push still rejected after 5 attempts"; exit 1
