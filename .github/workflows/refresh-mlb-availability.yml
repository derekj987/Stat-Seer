name: Refresh MLB models

# Rebuilds all four MLB data files, then commits them — Vercel auto-deploys.
#
# WHAT IT REBUILDS.
#   mlbAvailability.ts  Stage A: P(in tonight's starting lineup) + projected batting slot.
#   mlbGameModel.ts     projected runs and totals for the upcoming slate (/mlb/model).
#   mlbStrikeouts.ts    projected strikeouts for tonight's starters.
#   mlbPlayerProps.ts   calibrated hit / home-run probabilities (/mlb/model/players).
#
# All four project the UPCOMING slate off each team's PRIOR games, so every one of them is stale
# the moment a night of baseball is played — unlike football's weekly rhythm, this genuinely needs
# a daily run. Availability was scheduled first and the other three were added once they shipped;
# they share the same cached lineup days, so running them together costs almost nothing extra.
#
# The file keeps its original name so the existing schedule and run history carry over — GitHub
# keys a workflow on its path, and renaming the file would silently start a new one.
#
# CADENCE. 15:00 UTC = 11am ET, which is after the previous night's games have all gone Final (the
# west-coast late game ends ~06:00 UTC) and before lineups start posting for the evening slate
# (~3h before first pitch, so ~20:00 UTC for a 7pm ET game). That window is exactly when the board
# is most useful: last night is fully counted, tonight is still a projection.
#
# COST. None. statsapi.mlb.com is public and keyless, and completed days are cached on disk — but
# data/ is gitignored, so a fresh runner refetches the season each run (~180 calls, a couple of
# minutes). Cached across runs below to keep it quick; the key is pinned to the season so a new
# year invalidates it naturally.
#
# Mar–Oct only. Off-season the script would find no upcoming games and refuse to write, but the
# cron is scoped so the Actions log stays readable. All times UTC.

on:
  schedule:
    - cron: "0 15 * 3-10 *"   # daily 11am ET, March–October
  workflow_dispatch: {}        # manual "Run workflow"

concurrency:
  group: refresh-mlb-availability
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit the regenerated board data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the rebase-before-push works cleanly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet certifi -c requirements.txt

      # Completed days never change, so cache them rather than refetching ~180 dates every run.
      - name: Cache MLB lineup days
        uses: actions/cache@v4
        with:
          path: data/mlb_lineups
          key: mlb-lineups-2026-${{ github.run_id }}
          restore-keys: |
            mlb-lineups-2026-

      # Each script validates before it writes and refuses to emit an empty slate, so a bad day
      # leaves the previous file in place rather than blanking a board.
      - name: Rebuild MLB availability
        run: python mlb_availability.py
      - name: Rebuild MLB game model
        run: python mlb_game_model.py
      - name: Rebuild MLB pitcher strikeouts
        run: python mlb_strikeouts.py
      - name: Rebuild MLB player props
        run: python mlb_player_props.py

      # Scores OUR probabilities and the BOOK's de-vigged price against what actually happened, and
      # prints the comparison into the run log. Advisory: it must never fail the job, and it stays
      # silent about a verdict until enough completed games exist to reach one.
      - name: Grade hit props against the market (advisory)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python mlb_player_props.py --grade

      - name: Commit if changed
        env:
          FILES: >-
            web/lib/mlbAvailability.ts web/lib/mlbGameModel.ts
            web/lib/mlbStrikeouts.ts web/lib/mlbPlayerProps.ts
        run: |
          if git diff --quiet -- $FILES; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh MLB models (auto)"
          # Several bots push this branch; retry rebase+push a few times before failing.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i lost the race; retrying..."; sleep $((RANDOM % 5 + 2))
          done
          echo "push still rejected after 5 attempts"; exit 1
