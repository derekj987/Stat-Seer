name: Capture tailgate

# Fan-sentiment scan: Reddit team boards -> Claude (Sonnet) -> Supabase tailgate_buzz.
# NOT a pick and NOT model output -- never graded, never feeds The Model. See
# docs/TAILGATE_PIPELINE.md. Reddit is read via its public RSS feed (no app/creds).
#
# Reddit throttles a single IP after ~12 teams, so we SHARD the 32 teams into 4
# groups of 8 and run them as parallel matrix jobs -- each shard is a separate
# runner with its own IP, staying under the per-IP throttle. Full league, daily.
#
# Use the "test" dispatch mode first (shard 1 only, no secrets/table) to confirm
# Actions can reach Reddit.

on:
  schedule:
    - cron: "0 14 * 8-12,1 *"   # daily 14:00 UTC (~9-10am ET), Aug-Jan
  workflow_dispatch:
    inputs:
      mode:
        description: "test = reachability check (shard 1 only, no secrets/table); full = all shards + write"
        type: choice
        options: [test, full]
        default: test

concurrency:
  group: capture-tailgate
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet certifi anthropic -c requirements.txt
      - name: "Scan shard ${{ matrix.shard }}/4 -> Supabase"
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Dispatch input via env, not inline ${{ }} — inline values are pasted into the script as
          # text before bash runs, so a crafted input could execute. (matrix.shard is a static
          # workflow-defined value, not user input.)
          IN_MODE:              ${{ github.event.inputs.mode }}
        # Scheduled runs (no mode input) fall through to the full write of each shard.
        run: |
          if [ "$IN_MODE" = "test" ]; then
            if [ "${{ matrix.shard }}" = "1" ]; then
              python tailgate_reddit.py --current --no-extract --shard 1/4
            else
              echo "test mode: shard ${{ matrix.shard }} skipped"
            fi
          else
            python tailgate_reddit.py --current --write --shard ${{ matrix.shard }}/4
          fi
