name: Capture practice reports

# Free daily practice-participation capture from the open nflverse injuries feed
# (no vendor, no API key — SportsData.io was ruled out on cost). Each run writes
# THAT DAY's practice_status into practice_reports, tagged with the practice day.
# Polled Wed-Sat, the daily snapshots accumulate the DNP -> LIMITED -> FULL
# trajectory that CANNOT be backfilled. Idempotent (unique on season,week,team,
# name,day), so running twice a day is strictly safer than once.
#
# Two polls a day catch nflverse's refresh whenever it lands: 23:00 UTC (~6-7pm ET,
# same-day afternoon report) and 13:00 UTC (~8-9am ET, overnight refresh). Both UTC
# hours share the calendar day with ET, so the day tag is correct.
#
# Runs EVERY day, not Wed-Sat. The old `3,4,5,6` covered the days the practice report
# is written and stopped exactly before the days it matters: NFL games are played
# Sun/Mon/Thu, and a designation can change on the morning of the game. Derek found
# this the direct way — TreVeyon Henderson was ruled out for a Wednesday-night game
# and the board was still publishing a projection for him.
#
# What this does NOT cover, and it is worth being precise: the official INACTIVES
# list drops 90 minutes before kickoff and is not in the nflverse practice feed at
# all. That gap is closed on the READ side instead — web/lib/nflInactives.ts layers
# ESPN's live per-game designations over these rows at request time, on a 120s cache,
# which is fresher than any cron can be (Actions schedules routinely start 5-15
# minutes late, so a T-90 sweep can land at T-70).
# All times UTC.

on:
  schedule:
    - cron: "0 13,23 * 9-12,1 *"   # twice daily, EVERY day, Sep-Jan
  workflow_dispatch: {}                   # manual "Run workflow" for testing

concurrency:
  group: capture-practice
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet certifi -c requirements.txt
      - name: Capture practice reports -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest/injuries_nflverse.py --current --write
