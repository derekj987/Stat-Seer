name: Daily digest

# "What changed since yesterday" -- who went out, who came back, and which model numbers moved
# because of it. Derek: "I do not want to ask every day 'Hey Player X is now out for the season.
# Do you know this and have our numbers been updated?'"
#
# The guardrail in publish-predictions.yml covers the failure case by going red when the model has
# NOT noticed. This covers the ordinary case, where everything worked and he still wants to know.
#
# 15:30 UTC, after BOTH of the jobs it reports on: publish-predictions at 14:00 (football) and
# refresh-mlb-availability at 15:00 (baseball). It used to run at 14:30, which was right when this
# only covered football and silently wrong the moment MLB was added -- the baseball half reads the
# newest committed board, so at 14:30 it would have diffed yesterday's file against the day
# before's and reported day-old news as today's, every single day.
#
# A digest that runs before the thing it describes is not early, it is wrong.
#
# It sends nothing on a quiet day. A digest that arrives every morning regardless is one nobody
# opens by week three, and the whole point is that it stays worth reading.
#
# DELIVERY: e-mails through Resend when RESEND_API_KEY and DIGEST_TO are set as repository secrets.
# Neither exists yet -- the web app gets its Resend key from Vercel, not from Actions -- so until
# they are added this still runs and writes the digest to the job summary. Add the two secrets and
# the mail starts flowing with no code change.
#
# All times UTC.

on:
  schedule:
    # Mar-Jan: football is Sep-Jan, baseball Mar-Oct, so the digest spans both seasons.
    - cron: "30 15 * 1,3-12 *"
  workflow_dispatch:
    inputs:
      hours:
        description: "look-back window in hours"
        required: false
        default: "26"

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is LOAD-BEARING. The baseball half of the digest diffs the two most recent
      # commits of web/lib/mlbGameModel.ts, because MLB has no append-only table -- git IS its
      # change log. The default shallow checkout fetches one commit, so `git log -2 -- <path>`
      # returns a single sha, mlb_changes() finds nothing to diff against and returns empty. That
      # failure is completely silent: the digest just never mentions baseball.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy certifi -c requirements.txt
      - name: What changed since yesterday
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: |
          python analysis/daily_digest.py \
            --hours "${{ github.event.inputs.hours || '26' }}" --send
