name: Capture odds

# Free scheduled odds capture. Runs odds_client.py against the live Odds API and
# writes to Supabase. No Vercel/Pro needed -- GitHub Actions is the scheduler.
# All times UTC. Cadence is a starting point; tune the crons below as needed.

# TIERED CAPTURE. The 3-hourly sweep used to run with no commence window, so every 3 hours it wrote
# a snapshot of EVERY upcoming game -- all 18 weeks. In early September that meant re-recording Week
# 17's line eight times a day, for lines that barely move. Measured: 4,660 rows per snapshot spread
# across the whole season, ~29,000 rows/day against a lifetime average of 989, with 87% of the table
# belonging to games not yet played. odds_snapshots and prop_snapshots together are ~1.44M of the
# ~1.47M rows in the database, which is what pushed the project over its storage limit.
#
# So: frequent captures are now NEAR-TERM only, and the long-range opening lines are kept by a single
# daily full sweep instead of eight. Far-future line movement is still recorded, just once a day.
#
# This costs NO extra Odds API credits either way -- filter_commence_window is applied after the API
# response is parsed, so the request is identical; only the number of rows written to Supabase changes.

# 🚨 THE ODD MINUTE IS DELIBERATE — DO NOT "TIDY" IT BACK TO :00. GitHub runs scheduled
# workflows on a best-effort queue and the top of the hour is its busiest moment, so a cron at
# minute 0 is both delayed the most and dropped the most. Measured across this repo over several
# days: jobs scheduled on the hour arrived a median 58-84 minutes late and delivered 34-75% of
# their declared runs, and */30 delivered 10%. Every schedule here now sits on a distinct off-peak
# minute, which also stops our own jobs colliding with each other — three used to fire at 14:00.
# See EMPIRICAL_REFERENCE §17.
on:
  schedule:
    # Near-term sweep every 3 hours, Aug-Jan: games kicking off within 10 days (14400 min).
    # Establishes lines and, via the closing_lines view, backs up the pre-kickoff capture.
    - cron: "33 */3 * 8-12,1 *"
    # Long-range sweep once daily: the WHOLE season, no window, so opening lines for later weeks are
    # still captured for line-movement/CLV work. Hour 10 deliberately avoids the */3 hours
    # (0,3,6,9,12,15,18,21) so the two never fire together.
    - cron: "49 10 * 8-12,1 *"
    # Pre-kickoff sharpener: every 15 min through the game windows, filtered to games within 45 min
    # of kickoff. Two crons because the windows straddle midnight UTC: 1pm ET kicks off at 17:00
    # UTC, so the sweep must START at 16:00 (a window that opened AT 17:00 never saw a 1pm game),
    # and the night games — TNF/SNF/MNF at 00:15-00:20 UTC — fall on the NEXT UTC day (Fri/Mon/
    # Tue). The old single window (17-23 UTC, Sun/Mon/Thu) covered only the 4pm slate, and week 1
    # of 2026 has zero PRE_KICKOFF rows to show for it. 45 min > the 15-min interval plus GitHub's
    # usual scheduling delay.
    - cron: "7,22,37,52 16-23 * 8-12,1 0,1,4"
    - cron: "7,22,37,52 0-1 * 8-12,1 1,2,5"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

concurrency:
  group: capture-odds
  cancel-in-progress: false   # never interrupt an in-flight write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet certifi -c requirements.txt
      - name: Capture odds -> Supabase
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # 🚨 MATCH ON THE HOUR FIELD, NEVER THE WHOLE CRON STRING. This branched on the exact
          # schedule text, and the 2026-10-14 minute change (§17: every cron moved off :00) renamed
          # every pattern out from under it. `*/15 16-23 ...` became `7,22,37,52 16-23 ...`, which
          # matched nothing, so the closing-line sweeps fell silently through to the near-term
          # branch: ZERO PRE_KICKOFF rows from 2026-10-12 to 2026-10-27 while the job ran green
          # every game day. CLV is measured against the closing line, so that is the one capture
          # whose loss costs the most, and nothing failed to say so.
          #
          # The hour field is what actually distinguishes these sweeps, and it is the part nobody
          # edits for scheduling-queue reasons. A minute change can no longer alter behaviour.
          SCHED="${{ github.event.schedule }}"
          case "$SCHED" in
            *" 16-23 "*|*" 0-1 "*)
              # Closing line: only games about to kick off.
              python odds_client.py --live --write --reason PRE_KICKOFF --commence-within 45
              ;;
            *" 10 "*)
              # Once daily: the whole season, unwindowed, for long-range opening lines.
              python odds_client.py --live --write --reason SCHEDULED
              ;;
            *" */3 "*|"")
              # The 3-hourly near-term sweep, and manual runs. Listed EXPLICITLY rather than left
              # to the default so that the default can be what it should be: an alarm. Without
              # this arm the ordinary case warns on every run and the warning means nothing.
              python odds_client.py --live --write --reason SCHEDULED --commence-within 14400
              ;;
            *)
              # An UNRECOGNISED schedule says so rather than quietly taking a default — that
              # silence is exactly what hid the bug above for two weeks. It still captures, with
              # the safe near-term window, because a noisy run beats a missed one.
              echo "::warning::schedule '$SCHED' matched no branch in capture-odds.yml — fell back \
          to the near-term sweep. If a cron was edited, update the case to match it."
              python odds_client.py --live --write --reason SCHEDULED --commence-within 14400
              ;;
          esac
