name: Refresh NHL model

# Regenerates the NHL model's two generated files — web/lib/nhlPlayerProjections.ts (the
# line-blind player read: shots, goals, assists, points, saves) and web/lib/nhlGameModel.ts (team
# attack/defence ratings behind the game board) — and commits them, triggering a Vercel redeploy.
#
# WHAT IT ACTUALLY RECOMPUTES, AND WHY THAT IS SMALL. Only the CURRENT season changes day to day.
# The prior-season baselines and the P(over) table come from five seasons — 227,861 skater games,
# roughly 6,600 boxscores and over an hour of fetching — and they are constant for the whole year,
# so they are frozen into ingest/nhl_static_inputs.json once per season and read from there. This
# job therefore fetches only the current season's completed games.
#
# 🚨 THE FROZEN FILE AND THE DATABASE MUST PRODUCE THE SAME BOARD. nhl_player_proj.py applies the
# identical minimum-history cut (MIN_PRIOR_SKATER / MIN_PRIOR_GOALIE) and the identical rounding on
# both paths, because it is generated here and regenerated by hand locally. Verified by stripping a
# local database back to the current season and diffing: 676 of 676 projections identical. Before
# those two were unified it differed on 34 rows, one by a full shot — a board that changes depending
# on WHERE it was built is the thing this note exists to prevent.
#
# 10:00 UTC ~= 6am ET: after every game has finished and well before the day's props are shopped.
# All times UTC. Oct-June, matching the NHL season.

on:
  schedule:
    - cron: "0 10 * 10-12,1-6 *"
  workflow_dispatch: {}

concurrency:
  group: refresh-nhl-player-proj
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the rebase-before-push works cleanly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet certifi -c requirements.txt

      # The boxscore of a finished game never changes, so yesterday's fetches are reusable and the
      # job only ever pays for the games played since the last run. Without this the cost grows
      # with the season — 1,312 games by April — and the first April run would be the slow one
      # every single day.
      - name: Cache NHL boxscores
        uses: actions/cache@v4
        with:
          path: data/nhl_cache
          key: nhl-boxscores-${{ github.run_id }}
          restore-keys: |
            nhl-boxscores-

      # Goalie starts first: it populates data/nhl_cache, which nhl_skaters.py then re-parses
      # without any further requests. Running them the other way round fetches nothing.
      - name: Fetch current-season goalie starts
        run: python nhl_goalies.py --season 20262027

      - name: Extract skater game logs from the cached boxscores
        run: python nhl_skaters.py

      - name: Build line-blind player projections
        run: python nhl_player_proj.py --static ingest/nhl_static_inputs.json

      # The game board's team ratings come from the same database this job has just rebuilt, and
      # they are current-season only (PRIOR_W = 0, measured), so they go stale exactly as fast as
      # the player numbers do and refresh on the same cadence.
      - name: Build line-blind team ratings
        run: python nhl_game_model.py

      - name: Commit if changed
        run: |
          FILES="web/lib/nhlPlayerProjections.ts web/lib/nhlGameModel.ts"
          # The generated header carries counts and a league save%, not a timestamp, so an unchanged
          # board produces an unchanged file and this is a plain diff — no timestamp-stripping
          # needed, unlike refresh-nhl-rosters.yml.
          if git diff --quiet -- $FILES; then
            echo "No projection changes — nothing to commit."
            exit 0
          fi
          git diff --stat -- $FILES
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh NHL projections + team ratings (auto)"
          # Several bots push this branch; a push can lose the race even right after a rebase.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i lost the race; retrying..."; sleep $((RANDOM % 5 + 2))
          done
          echo "push still rejected after 5 attempts"; exit 1
